---
# ============================================================
# SOAR Auto-Recovery Playbook (Idempotent)
# Jalankan: ansible-playbook -i inventory/hosts.ini site.yml
# ============================================================

- name: Setup iptables + systemd web server di agent-02
  hosts: vm-agent-02
  become: true
  roles:
    - iptables

- name: Setup Wazuh active response di manager
  hosts: manager
  become: true
  roles:
    - wazuh

- name: Pastikan Docker stack jalan di manager
  hosts: manager
  become: true
  roles:
    - docker_stack

- name: Init TheHive org + user + API key
  hosts: manager
  become: true
  roles:
    - thehive_init

- name: Setup n8n credentials + workflow
  hosts: manager
  become: true
  roles:
    - n8n_automation
