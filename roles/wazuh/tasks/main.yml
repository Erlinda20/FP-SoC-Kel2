---
# ══════════════════════════════════════════════════
# Wazuh Manager — Idempotent Configuration
# Custom rules + active response via Python patching
# ══════════════════════════════════════════════════

# ── Deploy custom rules ──
- name: Tulis local_rules.xml
  copy:
    dest: /var/ossec/rules/local_rules.xml
    content: |
      <group name="local,ddos,syslog,">
        <rule id="100001" level="3">
          <match>FIREWALL_DDOS_ALERT</match>
          <description>iptables: DDoS log entry terdeteksi</description>
        </rule>
        <rule id="100004" level="12" frequency="10" timeframe="5" ignore="60">
          <if_matched_sid>100001</if_matched_sid>
          <same_source_ip />
          <match>SYN</match>
          <description>Massive SYN Flood Traffic Detected by Network Firewall</description>
          <group>attack,ddos,</group>
        </rule>
        <rule id="100005" level="10">
          <if_sid>100001</if_sid>
          <description>DDoS Alert dari iptables (non-SYN variant)</description>
          <group>attack,ddos,</group>
        </rule>
      </group>
    owner: root
    group: wazuh
    mode: '0640'
  notify: restart wazuh-manager

# ── Deploy active response script ──
- name: Deploy notify-n8n.sh
  copy:
    dest: /var/ossec/active-response/bin/notify-n8n.sh
    content: |
      #!/bin/bash
      LOG_FILE="/var/log/wazuh-n8n-webhook.log"
      N8N_URL="http://localhost:5678/webhook{{ n8n_webhook_path | default('/wazuh-ddos-alert') }}"
      INPUT_JSON=$(cat)
      ATTACKER_IP=$(echo "$INPUT_JSON" | python3 -c "
      import sys, json
      try:
          d = json.load(sys.stdin)
          ip = (d.get('parameters', {}).get('alert', {}).get('data', {}).get('srcip')
             or d.get('parameters', {}).get('alert', {}).get('data', {}).get('src_ip')
             or d.get('data', {}).get('srcip')
             or 'unknown')
          print(ip)
      except:
          print('unknown')
      " 2>/dev/null)
      RULE_ID=$(echo "$INPUT_JSON" | python3 -c "
      import sys, json
      try:
          d = json.load(sys.stdin)
          print(d.get('parameters', {}).get('alert', {}).get('rule', {}).get('id', 'unknown'))
      except:
          print('unknown')
      " 2>/dev/null)
      ALERT_LEVEL=$(echo "$INPUT_JSON" | python3 -c "
      import sys, json
      try:
          d = json.load(sys.stdin)
          print(d.get('parameters', {}).get('alert', {}).get('rule', {}).get('level', 'unknown'))
      except:
          print('unknown')
      " 2>/dev/null)
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      echo "$(date '+%Y-%m-%dT%H:%M:%S') [INFO] Active Response triggered. Rule=$RULE_ID Level=$ALERT_LEVEL AttackerIP=$ATTACKER_IP" >> "$LOG_FILE"
      PAYLOAD="{\"alert_level\":\"$ALERT_LEVEL\",\"rule_id\":\"$RULE_ID\",\"attacker_ip\":\"$ATTACKER_IP\",\"victim_ip\":\"{{ agent_02_ip | default('10.0.1.6') }}\",\"attack_type\":\"DDoS SYN Flood\",\"victim_agent\":\"agent-server-02\",\"timestamp\":\"$TIMESTAMP\"}"
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$PAYLOAD" --connect-timeout 5 --max-time 10 "$N8N_URL" 2>/dev/null)
      echo "$(date '+%Y-%m-%dT%H:%M:%S') [OK] Webhook sent. HTTP=$HTTP_STATUS Rule=$RULE_ID AttackerIP=$ATTACKER_IP" >> "$LOG_FILE"
      exit 0
    owner: root
    group: wazuh
    mode: '0750'
  notify: restart wazuh-manager

- name: Buat webhook log file
  file:
    path: /var/log/wazuh-n8n-webhook.log
    state: touch
    owner: root
    group: wazuh
    mode: '0664'
  changed_when: false

# ── Patch ossec.conf secara idempotent menggunakan script Python ──
# Logic: cek count notify-n8n SEBELUM modifikasi.
#   Jika sudah 3 (benar) → skip, print 3 → not changed
#   Jika bukan 3 (salah/duplikat/kosong) → fix, print pre_count → changed
- name: Tambahkan active-response config ke ossec.conf
  shell: |
    python3 << 'EOF'
    import re
    with open('/var/ossec/etc/ossec.conf', 'r') as f:
        content = f.read()
    pre_count = content.count('notify-n8n')
    if pre_count != 3:
        content = re.sub(r'\s*<command>\s*<name>notify-n8n</name>.*?</command>', '', content, flags=re.DOTALL)
        content = re.sub(r'\s*<active-response>\s*<command>notify-n8n</command>.*?</active-response>', '', content, flags=re.DOTALL)
        block = """
      <command>
        <name>notify-n8n</name>
        <executable>notify-n8n.sh</executable>
        <timeout_allowed>no</timeout_allowed>
      </command>

      <active-response>
        <command>notify-n8n</command>
        <location>server</location>
        <rules_id>100004</rules_id>
        <timeout>60</timeout>
      </active-response>
    """
        content = content.replace('</ossec_config>', block + '\n</ossec_config>')
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(content)
    print(pre_count)
    EOF
  register: active_response_update
  changed_when: active_response_update.stdout != '3'
  notify: restart wazuh-manager

- name: Pastikan wazuh-manager berjalan
  systemd:
    name: wazuh-manager
    state: started
    enabled: yes

# ── Deploy Integratord (custom-n8n.py) ──
- name: Deploy custom-n8n.py integration script
  copy:
    dest: /var/ossec/integrations/custom-n8n.py
    content: |
      #!/usr/bin/env python3
      import sys
      import json
      import urllib.request

      def main():
          if len(sys.argv) < 4:
              sys.exit(1)
          
          alert_file = sys.argv[1]
          hook_url = sys.argv[3]

          try:
              with open(alert_file) as f:
                  alert_json = json.load(f)

              data = json.dumps(alert_json).encode('utf-8')
              req = urllib.request.Request(hook_url, data=data, headers={'Content-Type': 'application/json'})
              
              with urllib.request.urlopen(req, timeout=10) as response:
                  pass
          except Exception as e:
              with open('/var/ossec/logs/integrations.log', 'a') as log:
                  log.write(f"Error sending to n8n: {e}\n")
              sys.exit(1)
          sys.exit(0)

      if __name__ == "__main__":
          main()
    owner: root
    group: wazuh
    mode: '0750'
  notify: restart wazuh-manager

- name: Tambahkan integratord config ke ossec.conf
  shell: |
    python3 << 'EOF'
    import re
    with open('/var/ossec/etc/ossec.conf', 'r') as f:
        content = f.read()
    pre_count = content.count('<name>custom-n8n.py</name>')
    if pre_count == 0:
        block = """
      <integration>
        <name>custom-n8n.py</name>
        <hook_url>http://localhost:5678/webhook/wazuh-ddos-alert</hook_url>
        <level>10</level>
        <alert_format>json</alert_format>
      </integration>
    """
        content = content.replace('</ossec_config>', block + '\n</ossec_config>')
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(content)
        print("changed")
    else:
        print("ok")
    EOF
  register: integratord_update
  changed_when: integratord_update.stdout == 'changed'
  notify: restart wazuh-manager
