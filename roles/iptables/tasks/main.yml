---
# ══════════════════════════════════════════════════
# Agent-02 — iptables + systemd web server + ossec.conf template
# ══════════════════════════════════════════════════

- name: Install iptables-persistent
  apt:
    name: iptables-persistent
    state: present
    update_cache: yes

- name: Cek apakah rule DDOS LOG sudah ada
  command: iptables -L INPUT -n
  register: iptables_rules
  changed_when: false

- name: Pasang iptables LOG rule untuk DDoS detection
  command: >-
    iptables -A INPUT -p tcp --syn --dport {{ victim_port }}
    -m limit --limit {{ rate_limit }} --limit-burst {{ rate_burst }}
    -j LOG --log-prefix "{{ log_prefix }}"
  when: 'log_prefix not in iptables_rules.stdout'

- name: Simpan iptables rules supaya persistent
  command: netfilter-persistent save
  changed_when: false

# ══════════════════════════════════════════════════
# Systemd web server (menggantikan nohup)
# ══════════════════════════════════════════════════

- name: Buat direktori /var/www/html
  file:
    path: /var/www/html
    state: directory
    mode: '0755'

- name: Buat index.html sederhana
  copy:
    dest: /var/www/html/index.html
    content: |
      <html>
      <head><title>SOAR Lab - Agent 02</title></head>
      <body>
        <h1>SOAR Lab - Agent 02</h1>
        <p>Web server aktif. Managed by Ansible.</p>
      </body>
      </html>
    mode: '0644'
    force: no

- name: Cek apakah soar-webserver service sudah terpasang
  stat:
    path: /etc/systemd/system/soar-webserver.service
  register: webserver_service_file

- name: Hentikan proses nohup python http.server lama jika ada
  shell: pkill -f 'python3 -m http.server' || true
  changed_when: false
  failed_when: false
  when: not webserver_service_file.stat.exists

- name: Deploy systemd service soar-webserver
  copy:
    dest: /etc/systemd/system/soar-webserver.service
    content: |
      [Unit]
      Description=SOAR Demo Web Server
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 -m http.server 80
      WorkingDirectory=/var/www/html
      Restart=always
      User=root

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  register: webserver_unit

- name: Reload systemd jika service file berubah
  systemd:
    daemon_reload: yes
  when: webserver_unit.changed

- name: Aktifkan dan jalankan soar-webserver
  systemd:
    name: soar-webserver
    state: started
    enabled: yes

# ══════════════════════════════════════════════════
# ossec.conf agent via Jinja2 template
# ══════════════════════════════════════════════════

- name: Backup ossec.conf agent sebelum modifikasi
  copy:
    src: /var/ossec/etc/ossec.conf
    dest: "/var/ossec/etc/ossec.conf.bak.{{ ansible_facts.date_time.iso8601_basic_short }}"
    remote_src: yes
    force: no
  changed_when: false
  failed_when: false

- name: Hapus duplikat ANSIBLE MANAGED blocks dari ossec.conf agent
  replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<!-- BEGIN ANSIBLE MANAGED.*?<!-- END ANSIBLE MANAGED[^>]*-->\s*'
    replace: ''
  failed_when: false

- name: Tambahkan kern.log monitoring ke ossec.conf agent
  shell: |
    python3 << 'EOF'
    import re
    with open('/var/ossec/etc/ossec.conf', 'r') as f:
        content = f.read()
    if '<location>/var/log/kern.log</location>' not in content:
        block = """
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/kern.log</location>
      </localfile>
    """
        content = content.replace('</ossec_config>', block + '\n</ossec_config>')
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(content)
        print("changed")
    else:
        print("ok")
    EOF
  register: agent_kern_log
  changed_when: agent_kern_log.stdout == 'changed'
  notify: restart wazuh-agent

- name: Tambahkan wazuh ke grup adm supaya bisa baca kern.log
  user:
    name: wazuh
    groups: adm
    append: yes
  notify: restart wazuh-agent

- name: Pastikan wazuh-agent berjalan
  systemd:
    name: wazuh-agent
    state: started
    enabled: yes
